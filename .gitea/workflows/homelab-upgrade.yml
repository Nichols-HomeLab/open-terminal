name: Homelab upstream upgrade

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

concurrency:
  group: homelab-open-terminal-upgrade
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install automation parser
        run: python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Test synchronization and deployment safeguards
        run: python3 -m unittest discover -s homelab/tests -p 'test_*.py'
      - name: Synchronize, test, publish and update GitOps
        env:
          GITEA_API_URL: http://gitea-http.external.svc.cluster.local:3000/api/v1
          GITEA_AUTOMATION_TOKEN: ${{ secrets.HOMELAB_AUTOMATION_TOKEN }}
          GH_BACKUP_TOKEN: ${{ secrets.GH_BACKUP_TOKEN }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
          GITEA_USERNAME: ${{ vars.REGISTRY_USERNAME }}
          NTFY_URL: http://ntfy.notifications.svc.cluster.local/updates
        run: python3 homelab/upstream-sync.py
